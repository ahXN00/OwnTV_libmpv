name: Publish

# Push a tag vYYYY.MM.N → full build + contract check → GitHub Packages → GitHub Release with the AAR.
# A published version is immutable: re-running on a tag that already published fails with 409, by design.
on:
  push:
    tags:
      - v*

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag must be vYYYY.MM.N, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    with:
      publish-version: ${{ needs.version.outputs.version }}

  release:
    name: GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libmpv-release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv libmpv/build/outputs/aar/libmpv-release.aar "libmpv-$VERSION.aar"
          {
            echo "Maven: \`tv.own.owntv:libmpv:$VERSION\` (GitHub Packages)"
            echo
            echo "Pinned sources: see \`buildscripts/include/depinfo.sh\` at this tag."
            echo
            echo '```'
            cat contract.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "libmpv-$VERSION.aar" --title "libmpv $VERSION" --notes-file notes.md --verify-tag
